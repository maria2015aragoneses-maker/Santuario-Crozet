<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d">
  <title id="t">Mapa de las tres zonas de la Isla Alfred Faure</title>
  <desc id="d">La reserva ocupa toda la costa; el campus de inteligencia artificial, un valle del interior; el parque eólico, las crestas del norte, junto al Pic du Mascarin.</desc>
  <rect width="800" height="640" fill="#eef2fb"/>

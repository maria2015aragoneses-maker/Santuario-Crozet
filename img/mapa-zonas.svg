    <rect x="315" y="368" width="26" height="10" rx="3"/><rect x="350" y="368" width="26" height="10" rx="3"/><rect x="385" y="368" width="26" height="10" rx="3"/><rect x="420" y="368" width="26" height="10" rx="3"/>
